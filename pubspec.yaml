name: ap_notes
description: "AP Notes - Advanced Note Taking Application"
version: 2.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  image_picker: ^0.8.9
  device_info_plus: ^9.1.0
  signature: ^5.3.0
  pdf: ^3.10.0
  printing: ^5.10.0
  intl: ^0.19.0
  file_picker: ^5.4.0
  google_generative_ai: ^0.4.0
  http: ^1.1.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/dragon_bg.png