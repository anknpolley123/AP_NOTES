name: Smart Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0

      - name: Fix common Gradle issues
        run: |
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          sed -i 's/minifyEnabled = true/minifyEnabled = false/g' android/app/build.gradle || true
          sed -i 's/shrinkResources = true/shrinkResources = false/g' android/app/build.gradle || true

      - name: Smart build loop
        run: |
          ATTEMPT=1
          until [ $ATTEMPT -gt 5 ]
          do
            echo "🚀 Attempt $ATTEMPT"

            flutter clean
            rm -rf build
            rm -rf android/.gradle

            flutter pub get

            # Try normal build
            flutter build apk --release && break

            echo "⚠️ Normal build failed, trying split-per-abi..."

            flutter build apk --release --split-per-abi && break

            echo "⚠️ Retry with no-tree-shake-icons..."

            flutter build apk --release --no-tree-shake-icons && break

            ATTEMPT=$((ATTEMPT+1))
          done

          if [ $ATTEMPT -gt 5 ]; then
            echo "❌ Build failed after multiple attempts"
            exit 1
          fi

      - name: Find APK
        run: |
          echo "Searching APK..."
          find build -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/