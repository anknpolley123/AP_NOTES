name: Build APK
on: push: branches: - main workflow_dispatch:
jobs: build: runs-on: ubuntu-latest
env:
  GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

steps:
  - name: Checkout
    uses: actions/checkout@v3

  - name: Setup Java
    uses: actions/setup-java@v3
    with:
      distribution: temurin
      java-version: 17

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: 3.22.0

  - name: Flutter Doctor
    run: flutter doctor

  - name: Clean Project
    run: flutter clean

  - name: Disable Gradle Watcher
    run: echo "org.gradle.vfs.watch=false" >> android/gradle.properties

  - name: Clear Cache
    run: rm -rf android/.gradle build

  - name: Get Dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release --split-per-abi --no-tree-shake-icons

  - name: Show Files
    run: find build -type f

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: apk
      path: build/app/outputs/